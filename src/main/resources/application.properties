server.port=8080
server.servlet.context-path=/

# ============================================================================
# Database Configuration
# ============================================================================
spring.datasource.url=jdbc:postgresql://localhost:5432/spacedoc
spring.datasource.username=spacedoc
spring.datasource.password=spacedoc_local_dev_password
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Flyway Configuration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ============================================================================
# Spring AI Configuration (Ollama)
# ============================================================================
spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.options.model=mistral
spring.ai.ollama.embedding.options.model=nomic-embed-text

# ============================================================================
# Application Configuration
# ============================================================================
spring.application.name=SpaceDoc Intelligence

# Logging
logging.level.root=INFO
logging.level.com.spacedoc=DEBUG
logging.level.org.springframework.security=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
logging.file.name=logs/spacedoc.log

# ============================================================================
# Security Configuration
# ============================================================================
spring.security.user.name=admin
spring.security.user.password=admin_local_dev_password

# Session
server.servlet.session.timeout=30m
server.servlet.session.tracking-modes=cookie

# CSRF
spring.security.filter.order=5

# ============================================================================
# JSP Configuration
# ============================================================================
spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp

# ============================================================================
# File Upload
# ============================================================================
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# ============================================================================
# Error Handling
# ============================================================================
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=on-param
server.error.include-exception=false
